<svg class="map__svg" viewBox="0 0 980 620" role="img" aria-labelledby="mapt mapd" xmlns="http://www.w3.org/2000/svg">
<title id="mapt">Bridgeway service network</title>
<desc id="mapd">A logistics network map showing New York City -- Manhattan, Brooklyn, Queens, the Bronx and Staten Island -- Nassau and Suffolk Counties on Long Island, and Hudson, Bergen and Essex Counties in northern New Jersey, connected by delivery routes between hub markers. Surrounding areas are shown unshaded for orientation and are not served; the eastern half of Suffolk County extends beyond this view.</desc>
